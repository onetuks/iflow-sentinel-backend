server:
    port: 8888

spring:
    application:
        name: iflow-sentinel
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/iflow_sentinel}
        username: ${SPRING_DATASOURCE_USERNAME:iflow_user}
        password: ${SPRING_DATASOURCE_PASSWORD:iflow_password}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            # 아티팩트 동기화가 REQUIRES_NEW 트랜잭션을 최대 MAX_CONCURRENT_SAP_CALLS(10)개 동시에 여는데,
            # 기본값(10)으로는 동기화 하나만으로 풀 전체가 소진돼 다른 요청이 커넥션 타임아웃을 겪는다.
            maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:20}
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: update
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
                format_sql: false
    mail:
        host: ${SPRING_MAIL_HOST:}
        port: ${SPRING_MAIL_PORT:}
        username: ${SPRING_MAIL_USERNAME:}
        password: ${SPRING_MAIL_PASSWORD:}
        properties:
            mail:
                smtp:
                    auth: ${SPRING_MAIL_SMTP_AUTH:true}
                    ssl:
                        enable: true
                        trust: "*"
                    socketFactory:
                        port: ${SPRING_MAIL_PORT:}
                        class: javax.net.ssl.SSLSocketFactory
                        fallback: false
                    connectiontimeout: 5000
                    timeout: 5000
                    writetimeout: 5000

iflow-sentinel:
    security:
        credential-key: ${CREDENTIAL_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
        jwt-secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-please-32bytes-minimum}
        jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    connector:
        connect-timeout: ${SAP_CONNECT_TIMEOUT:10s}
        read-timeout: ${SAP_READ_TIMEOUT:60s}

app:
    tenant:
        sync-cron: "0 */10 * * * *"
        log-level-cron: "0 */10 * * * *"
    notification:
        cron: "${APP_NOTIFICATION_CRON:0 * * * * *}"
        sender-email: "${APP_NOTIFICATION_SENDER:seyoung.park@inspien.co.kr}"
        dashboard-base-url: "${APP_DASHBOARD_BASE_URL:http://localhost:3000}"
